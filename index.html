<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>skc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     ★ここを変更★ は下の <script> 内の CONFIG にまとめています
     ========================================================= */
  :root {
    --bg: #EDF2EF;
    --sheet: #FFFFFF;
    --ink: #1F2A25;
    --sub: #5E6B64;
    --line: #DCE4DF;
    --green: #06C755;
    --green-ink: #FFFFFF;
    --gray: #9AA39E;
    --gray-ink: #FFFFFF;
    --warn-bg: #FFF4E5;
    --warn-ink: #8A4B00;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121815;
      --sheet: #1B231F;
      --ink: #E8EEEA;
      --sub: #A3B0A9;
      --line: #2C3832;
      --green: #06B84F;
      --gray: #56605B;
      --warn-bg: #33270F;
      --warn-ink: #F5C784;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.75;
    padding: env(safe-area-inset-top, 0px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 480px; margin: 0 auto; }

  /* ---- トップの skc ---- */
  .brand {
    text-align: center;
    padding: 36px 0 20px;
    font-weight: 900;
    font-size: clamp(64px, 22vw, 96px);
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--green);
  }

  .sheet {
    background: var(--sheet);
    border-radius: 24px;
    padding: 28px 22px 22px;
    border: 1px solid var(--line);
  }

  .page { display: none; }
  .page.active { display: block; }

  .step {
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 4px;
  }
  h1 {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 20px;
  }

  /* ---- 注意事項 ---- */
  .rules { list-style: none; display: grid; gap: 14px; }
  .rules li {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 10px;
    align-items: start;
    font-weight: 700;
    font-size: 16px;
  }
  .rules .mark {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--warn-bg);
    color: var(--warn-ink);
    display: grid; place-items: center;
    font-size: 15px; font-weight: 900;
    margin-top: 1px;
  }
  .rules small {
    display: block;
    font-weight: 500;
    font-size: 14px;
    color: var(--sub);
    margin-top: 2px;
  }

  /* 1番重要な注意 */
  .top-rule {
    border: 2px solid var(--green);
    border-radius: 18px;
    padding: 16px 16px 14px;
  }
  .top-rule .badge {
    display: inline-block;
    font-size: 13px; font-weight: 900;
    color: var(--green-ink); background: var(--green);
    padding: 2px 12px; border-radius: 999px;
    margin-bottom: 8px;
  }
  .top-rule .lead { font-size: 18px; font-weight: 900; line-height: 1.6; }

  details { margin-top: 12px; }
  summary {
    list-style: none;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 700;
    color: var(--ink);
    background: var(--bg);
    padding: 8px 16px; border-radius: 999px;
    cursor: pointer;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "＋"; font-weight: 900; }
  details[open] summary::after { content: "−"; }
  summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .examples { list-style: none; margin-top: 10px; display: grid; gap: 8px; }
  .examples li { font-size: 15px; font-weight: 700; padding-left: 2px; }

  .second-rule { margin-top: 22px; font-weight: 700; font-size: 16px; }

  /* 「削除」ではなく「送信取消」の図解 */
  .choice {
    display: flex; justify-content: center; gap: 18px;
    margin-top: 14px;
  }
  .choice figure { text-align: center; }
  .choice .pic {
    position: relative;
    width: 96px; height: 96px;
    border-radius: 18px;
    overflow: hidden;
  }
  .choice img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .choice .ng img { opacity: .55; }
  .choice .ng .pic::before,
  .choice .ng .pic::after {
    content: "";
    position: absolute; left: 50%; top: 50%;
    width: 120%; height: 6px;
    background: #E5383B;
    border-radius: 3px;
  }
  .choice .ng .pic::before { transform: translate(-50%, -50%) rotate(45deg); }
  .choice .ng .pic::after  { transform: translate(-50%, -50%) rotate(-45deg); }
  .choice .ok .pic { box-shadow: 0 0 0 4px var(--green); }
  .choice figcaption { margin-top: 8px; font-size: 14px; font-weight: 900; }
  .choice .ng figcaption { color: #E5383B; }
  .choice .ok figcaption { color: var(--green); }

  .contact {
    margin-top: 20px;
    font-size: 15px; font-weight: 700;
    text-align: center;
  }

  /* ---- 管理者 ---- */
  .admins {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .admin {
    text-align: center;
    padding: 18px 8px 16px;
    border-radius: 18px;
    background: var(--bg);
  }
  .avatar {
    width: 84px; height: 84px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: var(--green);
    color: var(--green-ink);
    display: grid; place-items: center;
    font-size: 32px; font-weight: 900;
    overflow: hidden;
    position: relative;
  }
  .avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .kana { font-size: 12px; color: var(--sub); line-height: 1.4; }
  .name { font-size: 18px; font-weight: 900; line-height: 1.4; word-break: break-all; }

  /* ---- ノートを閲覧してください ---- */
  .note {
    margin-top: 28px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--warn-bg);
    color: var(--warn-ink);
    font-weight: 900;
    font-size: 17px;
    text-align: center;
  }

  /* ---- ボタン（戻る：次へ = 1：2）---- */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .btn {
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    min-height: 56px;
    border: none;
    border-radius: 16px;
    font: inherit;
    font-size: 17px;
    font-weight: 900;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn.back { flex: 1; background: var(--gray); color: var(--gray-ink); }
  .btn.go   { flex: 2; background: var(--green); color: var(--green-ink); }
  .btn span { position: relative; z-index: 1; }

  /* 3秒待ちの状態：薄く表示して、左から緑が満ちていく */
  .btn.go.locked {
    background: var(--line);
    color: var(--sub);
    cursor: not-allowed;
  }
  .btn.go.locked::before {
    content: "";
    position: absolute; inset: 0;
    background: var(--green);
    opacity: .35;
    transform-origin: left;
    transform: scaleX(0);
    animation: fill var(--wait, 3s) linear forwards;
  }
  @keyframes fill { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .btn.go.locked::before { animation: none; }
  }
</style>
</head>

      <p class="step">2 / 2</p>
      <h1>管理者</h1>

      <div class="admins" id="admins"></div>

      <p class="contact">御用がございましたら、管理者のどちらかへご連絡ください。</p>

      <p class="note">ノートを閲覧してください。</p>

      <div class="actions">
        <button type="button" class="btn back" id="back2"><span>戻る</span></button>
        <a class="btn go" id="toLine" href="#" target="_blank" rel="noopener"><span>LINEグループへ</span></a>
      </div>
    </section>

</div>

<script>
  /* =========================================================
     ★ここを変更★
     ========================================================= */
  const CONFIG = {
    // グループLINEの招待リンク
    lineUrl: "https://line.me/ti/g/jPVUnU4FpY",

    // ボタンが押せるようになるまでの秒数
    waitSeconds: 5,

    // 管理者2人（icon は index.html と同じ場所に置いた画像のファイル名）
    admins: [
      { name: "齋藤 真央", kana: "さいとう まお", icon: "admin1.jpg" },
      { name: "木村", kana: "きむら", icon: "admin2.jpg" }
    ]
  };
  /* ========================================================= */

  // 管理者カードを作る（画像がないときは名前の1文字目を表示）
  const adminsEl = document.getElementById("admins");
  CONFIG.admins.forEach(a => {
    const card = document.createElement("div");
    card.className = "admin";
    card.innerHTML =
      '<div class="avatar"></div><p class="kana"></p><p class="name"></p>';
    const avatar = card.querySelector(".avatar");
    avatar.textContent = a.name.trim().charAt(0);
    if (a.icon) {
      const img = new Image();
      img.alt = a.name + "のアイコン";
      img.onerror = () => img.remove();
      img.src = a.icon;
      avatar.appendChild(img);
    }
    card.querySelector(".kana").textContent = a.kana;
    card.querySelector(".name").textContent = a.name;
    adminsEl.appendChild(card);
  });

  document.getElementById("toLine").href = CONFIG.lineUrl;

  // 表示してから◯秒は緑のボタンを押せないようにする
  let timer = null;
  function lock(btn) {
    const label = btn.querySelector("span");
    const original = btn.dataset.label || label.textContent;
    btn.dataset.label = original;
    btn.style.setProperty("--wait", CONFIG.waitSeconds + "s");
    btn.classList.remove("locked");
    void btn.offsetWidth;            // アニメーションを毎回最初から
    btn.classList.add("locked");
    btn.setAttribute("aria-disabled", "true");

    let left = CONFIG.waitSeconds;
    label.textContent = original + "　" + left + "秒";
    clearInterval(timer);
    timer = setInterval(() => {
      left--;
      if (left <= 0) {
        clearInterval(timer);
        btn.classList.remove("locked");
        btn.removeAttribute("aria-disabled");
        label.textContent = original;
      } else {
        label.textContent = original + "　" + left + "秒";
      }
    }, 1000);
  }

  // 待ち時間中のクリックを無効にする
  document.querySelectorAll(".btn.go").forEach(btn => {
    btn.addEventListener("click", e => {
      if (btn.classList.contains("locked")) e.preventDefault();
    });
  });

  function show(n) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("page" + n).classList.add("active");
    window.scrollTo(0, 0);
    lock(document.querySelector("#page" + n + " .btn.go"));
  }

  document.getElementById("next1").addEventListener("click", () => {
    if (!document.getElementById("next1").classList.contains("locked")) show(2);
  });
  document.getElementById("back2").addEventListener("click", () => show(1));
  document.getElementById("back1").addEventListener("click", () => history.back());

  show(1);
</script>
